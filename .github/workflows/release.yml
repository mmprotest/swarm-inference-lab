name: github-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate or republish
        required: true
        type: string
      publish:
        description: Publish a verified draft release
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Hosted Windows guests can migrate across CPU models. Use portable ATen
      # kernels for software acceptance; physical gates measure native hardware.
      ATEN_CPU_CAPABILITY: default
    steps:
      - name: Checkout immutable release tag recursively
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Prove immutable remote tag checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $remoteTag = (git ls-remote --exit-code origin "refs/tags/$env:RELEASE_TAG").Trim()
          $remotePeeled = (git ls-remote origin "refs/tags/$env:RELEASE_TAG^{}").Trim()
          $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{}").Trim().ToLowerInvariant()
          $remoteCommit = if ($remotePeeled) {
            ($remotePeeled -split "\s+")[0].ToLowerInvariant()
          } else {
            ($remoteTag -split "\s+")[0].ToLowerInvariant()
          }
          Write-Host "checked_out_commit=$headCommit"
          Write-Host "peeled_tag_commit=$tagCommit"
          Write-Host "remote_tag_commit=$remoteCommit"
          if ($headCommit -ne $tagCommit -or $headCommit -ne $remoteCommit) {
            throw "checked-out commit, local tag, and remote tag do not identify one commit"
          }
          [ordered]@{
            schema_version = 1
            release_tag = $env:RELEASE_TAG
            checked_out_commit = $headCommit
            local_tag_commit = $tagCommit
            remote_tag_commit = $remoteCommit
          } | ConvertTo-Json | Set-Content artifacts/release-checkout.json -Encoding utf8

      - name: Install exact build Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"

      - name: Download and verify pinned uv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/prepare_windows_toolchain.py --tools uv
          "PINNED_UV=$((Resolve-Path build/toolchain/uv-0.12.0/uv.exe).Path)" | Out-File $env:GITHUB_ENV -Append

      - name: Validate tag, package version, commit, and clean tree
        shell: pwsh
        run: '& $env:PINNED_UV run --python 3.11 python scripts/verify_release_version.py --tag $env:RELEASE_TAG --output artifacts/release-identity.json'

      - name: Synchronise source lock and verify source dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV sync --locked --python 3.11 --extra cpu --extra dev
          & $env:PINNED_UV run --python 3.11 python scripts/verify_colibri_source.py

      - name: Formatting, lint, and types
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV run --python 3.11 ruff format --check src tests scripts
          & $env:PINNED_UV run --python 3.11 ruff check src tests scripts
          & $env:PINNED_UV run --python 3.11 mypy

      - name: Unit, installer, integration, and failure tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV run --python 3.11 pytest tests/unit -q
          & $env:PINNED_UV run --python 3.11 pytest tests/installer -q
          & $env:PINNED_UV run --python 3.11 pytest tests/integration tests/failure -m "not gpu" -q

      - name: Build wheel and test isolated installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV build --wheel
          & $env:PINNED_UV run --python 3.11 python scripts/test_wheel_install.py --uv $env:PINNED_UV --python 3.11 --extra cpu --output artifacts/wheel-isolation.json

      - name: Productization software acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV run --python 3.11 python scripts/run_productization_acceptance.py run --run-repeatability --repeatability-timeout-seconds 600 --output artifacts/acceptance
          Compress-Archive -Path artifacts/acceptance/* -DestinationPath artifacts/productization-acceptance.zip -Force

      - name: Generate runtime profiles independently
        shell: pwsh
        run: '& $env:PINNED_UV run --python 3.11 python scripts/generate_runtime_profiles.py --uv $env:PINNED_UV --output-dir artifacts/runtime-profiles'

      - name: Download and verify complete native toolchain
        shell: pwsh
        run: 'python scripts/prepare_windows_toolchain.py --tools all'

      - name: Bootstrapper contract suite
        shell: pwsh
        run: '& build/toolchain/dotnet-10.0.302/dotnet.exe run --project installer/windows/SwarmBootstrap.ContractTests/SwarmBootstrap.ContractTests.csproj -c Release'

      - name: Build setup, manifest, checksums, and SBOM
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: '& $env:PINNED_UV run --python 3.11 python scripts/build_windows_installer.py --release --tag $env:RELEASE_TAG --output-dir release/generated --acceptance-zip artifacts/productization-acceptance.zip'

      - name: Verify signatures and complete release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV run --python 3.11 python scripts/verify_release_manifest.py release/generated/release-manifest.json
          & $env:PINNED_UV run --python 3.11 python scripts/verify_release_payload.py --manifest release/generated/release-manifest.json --payload-dir release/generated --checksums release/generated/SHA256SUMS

      - name: Clean and silent setup acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & scripts/test_windows_installer.ps1 -SetupPath release/generated/SwarmInferenceSetup-x64.exe -Label release-clean -EvidencePath artifacts/release-clean.json
          & scripts/test_windows_installer.ps1 -SetupPath release/generated/SwarmInferenceSetup-x64.exe -Label release-silent -EvidencePath artifacts/release-silent.json

      - name: Build upgrade and rollback fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PINNED_UV run --python 3.11 python scripts/build_windows_installer.py --fixture-version 0.1.0rc12 --output-dir release/fixtures/version-b
          & $env:PINNED_UV run --python 3.11 python scripts/build_windows_installer.py --fixture-version 0.1.0rc13 --fixture-doctor-failure --output-dir release/fixtures/broken

      - name: Upgrade, rollback, and uninstall acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & scripts/test_windows_upgrade.ps1 -SetupA release/generated/SwarmInferenceSetup-x64.exe -SetupB release/fixtures/version-b/SwarmInferenceSetup-x64.exe -BrokenSetup release/fixtures/broken/SwarmInferenceSetup-x64.exe -EvidencePath artifacts/release-upgrade.json
          & scripts/test_windows_uninstall.ps1 -SetupPath release/generated/SwarmInferenceSetup-x64.exe -EvidencePath artifacts/release-uninstall.json

      - name: Attest setup build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release/generated/SwarmInferenceSetup-x64.exe

      - name: Upload validated release candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ env.RELEASE_TAG }}
          path: |
            release/generated
            artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Create, verify, and publish draft for tag push
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& $env:PINNED_UV run --python 3.11 python scripts/publish_github_release.py --tag $env:RELEASE_TAG --release-dir release/generated --publish --output artifacts/github-release.json'

      - name: Verify and publish an existing draft on manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& $env:PINNED_UV run --python 3.11 python scripts/publish_github_release.py --tag $env:RELEASE_TAG --release-dir release/generated --resume-draft --publish --output artifacts/github-release.json'

      - name: Validate existing release metadata without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'gh release view $env:RELEASE_TAG --repo mmprotest/swarm-inference-lab --json tagName,name,isDraft,isPrerelease,url,assets'
