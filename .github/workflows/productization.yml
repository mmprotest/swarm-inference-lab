name: productization

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-matrix:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --extra cpu --extra dev
      - if: matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} ruff format --check src tests scripts
      - if: matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts
      - if: matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} mypy
      - run: uv run --python ${{ matrix.python-version }} pytest tests/unit -q
      - name: Stage-ring lifecycle contract
        run: >-
          uv run --python ${{ matrix.python-version }} pytest
          tests/unit/test_stage_ring_service_transport.py
          tests/unit/test_process_harness.py -q
      - name: Non-GPU process integration
        run: >-
          uv run --python ${{ matrix.python-version }} pytest
          tests/integration tests/failure -m "not gpu" -q

  software-acceptance:
    needs: python-matrix
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --python 3.11 --extra cpu --extra dev
      - name: Authoritative software acceptance with repeatability
        run: >-
          uv run --python 3.11 python scripts/run_productization_acceptance.py run
          --run-repeatability --repeatability-timeout-seconds 600
          --output artifacts/acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: productization-acceptance
          path: artifacts/acceptance
