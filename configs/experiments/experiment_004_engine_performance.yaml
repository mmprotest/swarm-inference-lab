name: experiment-004-engine-performance
seed: 4
execution_mode: single-host-engine-benchmark

profiles:
  correctness: qwen3_correctness
  performance: qwen3_fast

models:
  - model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: bfloat16

  - model_id: Qwen/Qwen3-4B
    revision: null
    dtype: bfloat16

engines:
  required:
    - custom_correctness
    - custom_fast
    - huggingface_eager
    - huggingface_optimised
    - sglang
  optional:
    - vllm
    - tensorrt_llm

workloads:
  - name: decode-focused
    input_tokens: 1
    output_tokens: 512
    concurrency: [1, 4, 16, 64]

  - name: realistic
    input_tokens: 128
    output_tokens: 256
    concurrency: [1, 4, 16, 64]

  - name: medium-prefill
    input_tokens: 2048
    output_tokens: 128
    concurrency: [1, 4, 16]

prefix_reuse:
  enabled: true
  request_count: 4
  common_prefix_tokens: 1024
  unique_suffix_tokens: 32
  output_tokens: 128

repeats: 5
warmup_requests: 3

qwen3_engine:
  attention_backend: auto

custom_engine:
  attention_backends:
    - auto
    - sdpa
    - flash_attention_2
    - flashinfer
    - eager
  cache_backends:
    - dynamic_reference
    - static
  cache_dtype: bfloat16
  compile_modes:
    - eager
    - default
    - reduce-overhead
    - max-autotune
    - manual-cuda-graph
  cuda_graph_batch_sizes: [1, 2, 4, 8, 16, 32, 64]
  max_sequence_length: 4096
  final_worker_sampling: true
  continuous_batching: true
  gpu_resident_local_path: true
  prefill_chunk_size: 512

acceptance:
  require_exact_greedy_token_identity: true
  minimum_speedup_over_current_baseline: 4.0
  minimum_fraction_of_fastest_production_engine: 0.50
  target_fraction_of_fastest_production_engine: 0.80
  maximum_result_cv: 0.10

external_environments:
  root: artifacts/engine-environments
  huggingface_transformers: 4.57.6
  huggingface_torch: 2.13.0
  sglang: 0.5.16
  vllm: 0.25.1
  tensorrt_llm: 1.3.0rc15

measurement:
  gpu_sample_interval_ms: 100
  profile_decode_tokens: 32
  use_nsight_systems_when_available: true
  use_pytorch_profiler: true

output_root: artifacts/runs
