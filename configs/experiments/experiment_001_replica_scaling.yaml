schema_version: "1"
name: experiment-001-replica-scaling
execution_mode: single-host-loopback
backend: synthetic
data_plane: direct
seed: 20260730
scheduler: replicated-stage

model:
  layer_count: 2
  bytes_per_layer: 2147483648
  hidden_size: 4096
  activation_dtype: float32
  cache_bytes_per_token_per_layer: 4096
  compute_work_per_layer: 1
  routing: dense
  expert_count: 1
  active_experts: 1
  model_seed: 307
  stage_count: 2
  cpu_work_units: 0
  cpu_kernel_buffer_bytes: 16384

synthetic_compute:
  mode: calibrated_cpu
  target_stage_ms: 8.0
  acceptable_min_ms: 6.0
  acceptable_max_ms: 10.0
  activation_bytes: 16384
  calibration_warmup_iterations: 100
  calibration_measurement_iterations: 500
  single_threaded: true
  cpu_affinity: true

matrix:
  worker_counts: [2, 4, 8]
  concurrency_levels: [1, 16, 64]
  repeats: 3
  warmup_seconds: 10
  measurement_seconds: 30

workload:
  concurrent_requests: 64
  prompt_tokens: 1
  output_tokens: 32
  workload_class: standard
  arrival_interval_ms: 0

worker:
  logical_memory_limit_bytes: 2211908157
  outbound_queue_capacity: 1024
  inbound_queue_capacity: 1024
  max_inflight_operations: 256
  route_lease_seconds: 600

transport:
  persistent_streams: true
  coordinator_relay_fallback: false
  checksum: true
  reconnect_attempts: 5
  reconnect_initial_backoff_ms: 25
  reconnect_max_backoff_ms: 1000

queue:
  capacity: 1024
  max_microbatch_size: 1
  max_microbatch_wait_ms: 0
  request_deadline_ms: 300000
  backpressure_policy: wait

faults: {}

integrity:
  enabled: true
  audit_fraction: 0

acceptance:
  minimum_aggregate_verified_tokens_s: 20
  minimum_duration_s: 30
  minimum_stage_utilisation: 0
  minimum_doubling_gain: 1.5
  maximum_capacity_imbalance: 1
  minimum_completion_fraction: 1
  maximum_churn_throughput_degradation: 0.10
  min_ratio_2_to_4: 1.50
  min_ratio_4_to_8: 1.50
  min_ratio_2_to_8: 2.25
  max_primary_cv: 0.10
  min_meaningful_replica_fraction: 0.75
  max_replica_imbalance_ratio: 1.50
  max_capacity_prediction_error: 0.25
  require_zero_coordinator_activation_bytes: true

network:
  from: ../networks/localhost.yaml

nodes:
  - from: ../nodes/desktop_cpu.yaml
    count: 8
    memory_bytes: 2211908157
    measured: false

node_counts: [2, 4, 8]
concurrent_request_counts: [1, 16, 64]
warmup_s: 10
steady_state_s: 30
output_root: artifacts/runs
model_id: synthetic-loopback-4gib-calibrated
model_revision: experiment-001-v2
notes:
  - This is a single-host-loopback replica-scaling experiment, not physical distributed scaling.
  - Workers are separate single-threaded processes with dedicated logical CPU affinity when supported.
  - The 4 GiB logical model is split into two stages; no worker has enough logical memory for the full model.
  - Intermediate activations use direct persistent worker-to-worker streams.
