schema_version: "1"
name: physical-lan-manual
execution_mode: physical-lan
seed: 12345
scheduler: static
model:
  layer_count: 16
  bytes_per_layer: 268435456
  hidden_size: 512
  activation_dtype: float32
  cache_bytes_per_token_per_layer: 2048
  compute_work_per_layer: 1
  routing: dense
  expert_count: 1
  active_experts: 1
  model_seed: 7
  stage_count: 2
workload:
  concurrent_requests: 4
  prompt_tokens: 8
  output_tokens: 16
  workload_class: standard
  arrival_interval_ms: 0
queue:
  capacity: 64
  max_microbatch_size: 1
  max_microbatch_wait_ms: 0
  request_deadline_ms: 300000
  backpressure_policy: reject
faults: {}
integrity:
  enabled: true
  audit_fraction: 0.05
network:
  from: ../networks/home_lan.yaml
nodes:
  - from: ../nodes/rtx5090.yaml
    count: 1
  - from: ../nodes/laptop_cpu.yaml
    count: 1
  - from: ../nodes/raspberry_pi5.yaml
    count: 1
node_counts: []
concurrent_request_counts: []
warmup_s: 30
steady_state_s: 300
output_root: artifacts/runs
model_id: synthetic-physical-smoke
model_revision: synthetic-v1
notes:
  - This file is a manual orchestration template; registration replaces assumed profiles with measurements.

