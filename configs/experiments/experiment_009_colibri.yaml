schema_version: experiment-009-v1
name: experiment-009-colibri-adaptive-expert-runtime
execution_mode: colibri-adaptive-expert-runtime
seed: 9009

dependency:
  repository: JustVugg/colibri
  release: v1.4.0
  commit: b085b48888a88d9a1c00b151a9979774b72cdbfd
  license: Apache-2.0
  checkout: third_party/colibri
  build_directory: build/colibri

backend:
  backend: colibri
  mode: bridge
  telemetry_level: summary
  cap: 1
  practical_baseline_cap: 16
  quant_bits: 8
  startup_timeout_seconds: 600
  request_timeout_seconds: 1800
  ram_safety_reserve_bytes: 8589934592

fixture:
  path: build/fixtures/glm_tiny
  model_id: experiment-009-glm-tiny
  model_revision: colibri-upstream-seed-1234
  model_family: glm-5.2
  prompt: "?"
  expected_input_token_ids: [63]
  expected_output_token_ids: []

practical_model:
  repository: allenai/OLMoE-1B-7B-0125-Instruct
  revision: b89a7c4bc24fb9e55ce2543c9458ce0ca5c4650e
  model_id: allenai/OLMoE-1B-7B-0125-Instruct
  model_family: olmoe
  converted_path: artifacts/models/colibri/olmoe-1b-7b-0125-instruct-merged

tuning:
  repeats: 3
  minimum_gain_fraction: 0.03
  maximum_p95_regression_fraction: 0.05
  replay_completion_tokens: 8
  candidates:
    - candidate_id: baseline
      settings: {}
    - candidate_id: prefetch_l1
      settings: {PILOT: "1"}
    - candidate_id: prefetch_l2
      settings: {PILOT: "2"}
    - candidate_id: wider_prefetch
      settings: {PILOT: "1", WIDE: "2"}

routing:
  cache_slots_per_layer: 16
  hot_slots_per_layer: 4
  policies:
    - plain_lru
    - frequency_hot_experts
    - recent_token_reuse
    - transition_history
    - colibri_recommended
    - swarm_planner
  prompts:
    - {prompt_id: cal-chat, workload_group: general_chat, partition: calibration, text: "Explain why leaves change colour in autumn."}
    - {prompt_id: cal-code, workload_group: coding, partition: calibration, text: "Write a Python function that merges two sorted lists."}
    - {prompt_id: cal-math, workload_group: mathematics_reasoning, partition: calibration, text: "A train travels 180 km in 2.5 hours. Find its average speed."}
    - {prompt_id: cal-multi, workload_group: multilingual_long_form, partition: calibration, text: "Resume en francais les causes de la Revolution industrielle."}
    - {prompt_id: held-chat, workload_group: general_chat, partition: heldout, text: "How can I build a consistent morning routine?"}
    - {prompt_id: held-code, workload_group: coding, partition: heldout, text: "Implement binary search in Python and state its complexity."}
    - {prompt_id: held-math, workload_group: mathematics_reasoning, partition: heldout, text: "If x squared minus 5x plus 6 equals zero, solve for x."}
    - {prompt_id: held-multi, workload_group: multilingual_long_form, partition: heldout, text: "Escribe un ensayo breve sobre la conservacion del agua."}

acceptance:
  minimum_correctness_requests: 50
  maximum_decode_regression_fraction: 0.03
  maximum_ttft_regression_fraction: 0.05
  maximum_p95_regression_fraction: 0.05

output_root: artifacts/runs
